<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1626"/>
      <stop offset="1" stop-color="#080b12"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ef2ff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0f9d94"/>
    </linearGradient>
    <linearGradient id="topface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ef6ff"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a7f8ff" stop-opacity="0.95"/>
      <stop offset="1"   stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- app tile -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#tile)"/>
  <rect x="18" y="18" width="476" height="476" rx="102" fill="none" stroke="#2b3b55" stroke-width="3"/>
  <ellipse cx="256" cy="235" rx="200" ry="180" fill="url(#glow)"/>

  <!-- ===== solid half of the VM cube ===== -->
  <!-- top face -->
  <polygon points="256,110 376,170 256,230 136,170" fill="url(#topface)" fill-opacity="0.92" stroke="#c9fbff" stroke-width="2" stroke-opacity="0.5"/>
  <!-- front-left face (solid) -->
  <polygon points="136,170 256,230 256,360 136,300" fill="url(#teal)" fill-opacity="0.85" stroke="#0b7d76" stroke-width="1.5"/>
  <!-- inner "window" panes on the solid face -->
  <polygon points="152,196 236,238 236,268 152,226" fill="#0a2e33" fill-opacity="0.55"/>
  <polygon points="152,240 236,282 236,338 152,296" fill="#0a2e33" fill-opacity="0.4"/>

  <!-- ===== dissolving / hidden half (right face) ===== -->
  <polygon points="376,170 256,230 256,360 376,300"
           fill="url(#cyan)" fill-opacity="0.10"
           stroke="url(#cyan)" stroke-width="2.5" stroke-opacity="0.75"
           stroke-dasharray="10 11" stroke-linejoin="round"/>

  <!-- pixel dissolve trailing off to the right -->
  <g fill="#22d3ee">
    <rect x="384" y="196" width="15" height="15" opacity="0.7"/>
    <rect x="410" y="182" width="13" height="13" opacity="0.5"/>
    <rect x="404" y="228" width="14" height="14" opacity="0.55"/>
    <rect x="432" y="210" width="11" height="11" opacity="0.35"/>
    <rect x="428" y="256" width="12" height="12" opacity="0.4"/>
    <rect x="456" y="238" width="9"  height="9"  opacity="0.25"/>
    <rect x="396" y="284" width="13" height="13" opacity="0.45"/>
    <rect x="424" y="300" width="10" height="10" opacity="0.3"/>
    <rect x="452" y="286" width="8"  height="8"  opacity="0.2"/>
  </g>
  <g fill="#a78bfa">
    <rect x="418" y="200" width="10" height="10" opacity="0.5"/>
    <rect x="444" y="268" width="9"  height="9"  opacity="0.35"/>
    <rect x="410" y="262" width="8"  height="8"  opacity="0.4"/>
  </g>

  <!-- horizontal scan line sweeping across the cube -->
  <rect x="96" y="248" width="360" height="6" rx="3" fill="url(#scan)"/>
  <rect x="96" y="253" width="360" height="2" fill="#0a0e17" opacity="0.35"/>
</svg>
