    <g><rect x="342" y="142" width="283" height="70" rx="11" fill="url(#card)" stroke="#22d3ee" stroke-opacity="0.30"/><rect x="342" y="142" width="4" height="70" rx="2" fill="#22d3ee"/><text x="366" y="176" font-size="17" font-weight="800" fill="#e6edf3">2 · Backdoor I/O port</text><text x="366" y="198" font-family="Menlo, monospace" font-size="12.5" fill="#7f90a8">0x5658 'VMXh' restricted</text></g>
    <g><rect x="644" y="142" width="283" height="70" rx="11" fill="url(#card)" stroke="#22d3ee" stroke-opacity="0.30"/><rect x="644" y="142" width="4" height="70" rx="2" fill="#22d3ee"/><text x="668" y="176" font-size="17" font-weight="800" fill="#e6edf3">3 · RDTSC timing</text><text x="668" y="198" font-family="Menlo, monospace" font-size="12.5" fill="#7f90a8">virtual_rdtsc passthrough</text></g>
    <g><rect x="946" y="142" width="283" height="70" rx="11" fill="url(#card)" stroke="#22d3ee" stroke-opacity="0.30"/><rect x="946" y="142" width="4" height="70" rx="2" fill="#22d3ee"/><text x="970" y="176" font-size="17" font-weight="800" fill="#e6edf3">4 · SMBIOS / DMI</text><text x="970" y="198" font-family="Menlo, monospace" font-size="12.5" fill="#7f90a8">reflect real host tables</text></g>
