    <g><rect x="644" y="224" width="283" height="70" rx="11" fill="url(#card)" stroke="#22d3ee" stroke-opacity="0.30"/><rect x="644" y="224" width="4" height="70" rx="2" fill="#22d3ee"/><text x="668" y="258" font-size="17" font-weight="800" fill="#e6edf3">7 · Legacy ports</text><text x="668" y="280" font-family="Menlo, monospace" font-size="12.5" fill="#7f90a8">floppy · serial · parallel</text></g>
