    <g><rect x="342" y="306" width="283" height="70" rx="11" fill="url(#card)" stroke="#22d3ee" stroke-opacity="0.30"/><rect x="342" y="306" width="4" height="70" rx="2" fill="#22d3ee"/><text x="366" y="340" font-size="17" font-weight="800" fill="#e6edf3">10 · Hyper-V leaves</text><text x="366" y="362" font-family="Menlo, monospace" font-size="12.5" fill="#7f90a8">vhv enlightenments off</text></g>
